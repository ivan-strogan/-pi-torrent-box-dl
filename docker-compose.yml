services:
  # FlareSolverr runs on Synology NAS (192.168.0.99) — too slow for Pi 3
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   ports:
  #     - "8191:8191"
  #   restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ./jackett/config:/config
      - ./jackett/downloads:/downloads
      - ./scripts/jackett-init.sh:/custom-cont-init.d/jackett-custom.sh:ro
    ports:
      - "9117:9117"
    restart: unless-stopped
